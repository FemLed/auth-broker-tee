## Enroll a replacement custody replica for auth-broker-tee.
##
## Use when one of the two replicas is gone for good: its VM was deleted after a
## crash it did not come back from, or after a failover. The live replica
## re-keys the new VM once it proves, with key-bound attestation, that it runs
## the same image under the slot name the live replica was launched with. The
## new VM takes the role opposite the live replica's. Nothing here can create or
## restore a key: if no replica holds the lineage, only operator re-genesis
## (operator-genesis.yml) remains.

name: replica-enroll

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "The live broker's image digest (sha256:...)"
        required: true
        type: string
      image_reference:
        description: "Full image reference path without digest"
        required: false
        default: "us-west1-docker.pkg.dev/prod-femled-couple-router/auth-broker/auth-broker-tee"
        type: string
      slot:
        description: "The lost replica's slot"
        required: true
        type: choice
        options:
          - a
          - b
      zone:
        description: "Zone for the replacement (us-west1, where the reserved address lives)"
        required: false
        default: "us-west1-b"
        type: string
      operator_statement:
        description: "Must explicitly contain 'operator-authorized replica enrollment'"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: prod-femled-couple-router

jobs:
  enroll:
    name: enroll replacement replica
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate inputs and operator statement
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          ZONE: ${{ inputs.zone }}
          OPERATOR_STATEMENT: ${{ inputs.operator_statement }}
        run: |
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::image_digest must be a sha256 digest"
            exit 1
          fi
          if [[ ! "${ZONE}" =~ ^us-west1-[a-c]$ ]]; then
            echo "::error::zone must be a us-west1 zone"
            exit 1
          fi
          if ! echo "${OPERATOR_STATEMENT}" | grep -qiE 'operator[- ]authorized.*replica enrollment'; then
            echo "::error::operator_statement must explicitly contain 'operator-authorized replica enrollment'"
            exit 1
          fi

      - name: Authenticate to GCP for VM provisioning
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/125139120897/locations/global/workloadIdentityPools/gh-actions-pool/providers/github-oidc
          service_account: ${{ vars.SUCCESSOR_ACTIVATION_SERVICE_ACCOUNT }}
          access_token_lifetime: 1800s

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve the slot and the live replica
        id: slot
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SLOT: ${{ inputs.slot }}
        run: |
          digest_hex="${IMAGE_DIGEST#sha256:}"
          short="${digest_hex:0:12}"
          if [[ "${SLOT}" == "a" ]]; then peer_slot=b; else peer_slot=a; fi
          vm_name="auth-broker-tee-${SLOT}-${short}"
          peer_name="auth-broker-tee-${peer_slot}-${short}"
          if [[ -n "$(gcloud compute instances list --project="${GCP_PROJECT_ID}" --filter="name=${vm_name}" --format='value(name)')" ]]; then
            echo "::error::${vm_name} still exists; delete the lost replica's VM before enrolling a replacement"
            exit 1
          fi
          peer_zone=$(gcloud compute instances list --project="${GCP_PROJECT_ID}" --filter="name=${peer_name}" --format='value(zone.basename())')
          if [[ -z "${peer_zone}" ]]; then
            echo "::error::the live replica ${peer_name} does not exist; with no replica holding the lineage only operator re-genesis remains"
            exit 1
          fi
          peer_ip=$(gcloud compute instances describe "${peer_name}" --project="${GCP_PROJECT_ID}" --zone="${peer_zone}" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')
          curl -fsS --max-time 15 "http://${peer_ip}:8080/replica/manifest" > peer-manifest.json
          jq -e --arg digest "${IMAGE_DIGEST}" \
            '.imageDigest == $digest and (.status == "active" or .status == "activating_successor") and (.role == "primary" or .role == "custodian")' \
            peer-manifest.json >/dev/null \
            || (echo "::error::${peer_name} does not hold the lineage on ${IMAGE_DIGEST}"; jq '{status, role, imageDigest}' peer-manifest.json; exit 1)
          peer_role=$(jq -r .role peer-manifest.json)
          if [[ "${peer_role}" == "primary" ]]; then role=custodian; else role=primary; fi
          {
            echo "vm_name=${vm_name}"
            echo "peer_name=${peer_name}"
            echo "peer_ip=${peer_ip}"
            echo "peer_url=http://${peer_name}.${peer_zone}.c.${GCP_PROJECT_ID}.internal:8080"
            echo "role=${role}"
          } >> "$GITHUB_OUTPUT"
          echo "Replacement ${vm_name} will be re-keyed by ${peer_name} (${peer_role}) as ${role}"

      - name: Provision the replacement replica
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          ZONE: ${{ inputs.zone }}
          VM_NAME: ${{ steps.slot.outputs.vm_name }}
          PEER_NAME: ${{ steps.slot.outputs.peer_name }}
          PEER_URL: ${{ steps.slot.outputs.peer_url }}
          ROLE: ${{ steps.slot.outputs.role }}
        run: |
          metadata="tee-image-reference=${IMAGE_REFERENCE}@${IMAGE_DIGEST}"
          metadata="${metadata},tee-restart-policy=Always"
          metadata="${metadata},tee-signed-image-repos=${IMAGE_REFERENCE}"
          metadata="${metadata},tee-env-REPLICA_ROLE=${ROLE}"
          metadata="${metadata},tee-env-REPLICA_PEER_URL=${PEER_URL}"
          metadata="${metadata},tee-env-REPLICA_PEER_INSTANCE=${PEER_NAME}"
          gcloud compute instances create "${VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${ZONE}" \
            --machine-type=c3-standard-4 \
            --confidential-compute-type=TDX \
            --maintenance-policy=TERMINATE \
            --image-family=confidential-space \
            --image-project=confidential-space-images \
            --boot-disk-size=20GB \
            --boot-disk-type=pd-balanced \
            --service-account="auth-broker-tee@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --scopes=cloud-platform \
            --tags=auth-broker-tee,auth-broker-tee-replica \
            --shielded-secure-boot \
            --shielded-vtpm \
            --shielded-integrity-monitoring \
            --metadata="${metadata}"

      - name: Wait for the live replica to re-key the replacement
        env:
          VM_NAME: ${{ steps.slot.outputs.vm_name }}
          PEER_IP: ${{ steps.slot.outputs.peer_ip }}
          ROLE: ${{ steps.slot.outputs.role }}
        run: |
          deadline=$(( $(date +%s) + 900 ))
          while [[ $(date +%s) -lt ${deadline} ]]; do
            curl -sS --max-time 15 "http://${PEER_IP}:8080/replica/manifest" > peer-manifest.json || true
            if jq -e --arg vm "${VM_NAME}" --arg role "${ROLE}" \
                '.peer.instanceName == $vm and .peer.role == $role' peer-manifest.json >/dev/null 2>&1; then
              echo "${VM_NAME} holds custody as ${ROLE}"
              jq '{status, role, epoch, replicaSerial, peer}' peer-manifest.json
              {
                echo "## Replica enrolled"
                echo ""
                echo "**Replacement:** \`${VM_NAME}\` as ${ROLE}"
                echo ""
                echo "\`\`\`json"
                jq '{status, role, epoch, imageDigest, replicaSerial, peer}' peer-manifest.json
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Replacement not re-keyed yet; sleeping 15s"
            sleep 15
          done
          echo "::error::${VM_NAME} was not re-keyed in time"
          exit 1

      - name: Delete the replacement on failure
        if: failure()
        env:
          ZONE: ${{ inputs.zone }}
          VM_NAME: ${{ steps.slot.outputs.vm_name }}
        run: |
          if [[ -n "${VM_NAME}" ]]; then
            gcloud compute instances delete "${VM_NAME}" \
              --zone="${ZONE}" --project="${GCP_PROJECT_ID}" --quiet || true
          fi
